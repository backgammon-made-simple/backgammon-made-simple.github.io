project:
  type: website
  output-dir: _site
  resources:
    - assets/logo.svg

website:
  title: "Backgammon Made Simple"
  description: "Learn the ideas behind strong backgammon decisions, one concept and one position at a time."
  site-url: "https://backgammon-made-simple.github.io"
  search:
    location: navbar
    type: overlay
  favicon: assets/logo.svg
  image: assets/logo.svg
  open-graph: true
  twitter-card: true
  navbar:
    logo: assets/logo.svg
    logo-alt: "Backgammon Made Simple"
    left:
      - text: Learn
        href: learn/index.qmd
      - href: analyze/index.qmd
        text: Analyze
      - href: sage-vs-gnu/index.qmd
        text: Sage vs GNU
      - href: blog/index.qmd
        text: Blog
      - href: about.qmd
        text: About
  sidebar:
    - id: learn
      title: "Learn"
      style: docked
      collapse-level: 2
      contents:
        - learn/index.qmd
        - section: "Start Here"
          contents:
            - learn/start-here/index.qmd
            - learn/game-plans/index.qmd
            - learn/reading-positions-and-engines/index.qmd
        - section: "Demystifying the Doubling Cube"
          contents:
            - learn/cube/index.qmd
            - learn/cube/what-the-cube-is-asking/index.qmd
        - section: "Opening Play Lab"
          contents:
            - learn/opening-play/index.qmd
  page-footer:
    left: |
      Copyright 2026 Marty Gale - Backgammon Made Simple
    center: |
      This lesson is available for non-commercial use under the PolyForm Noncommercial License 1.0.0. Reuse or adaptation must credit Backgammon Made Simple, identify Marty Gale as the original author, and reference the original page or repository. Commercial use requires written permission.
    right:
      - text: RSS
        href: blog/index.xml

format:
  html:
    theme: [cosmo, assets/bms-theme.scss]
    css:
      - assets/bms-shared.css
      - assets/bms-components.css
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: true
    code-copy: true

execute:
  freeze: auto

editor: visual
