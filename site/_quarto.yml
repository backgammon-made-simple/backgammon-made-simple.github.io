project:
  type: website
  output-dir: _site
  pre-render:
  - python ../scripts/bms_pre_render.py
  post-render:
  - python ../scripts/bms_post_render.py
  resources:
    - assets/logo.svg
    - "assets/icons/**"
    - "assets/social/generated/*.png"
    - assets/bms-glossary.js
    - "data/engine-benchmark/**"
    - "engine-benchmark/**/figures/**"
    - "engine-benchmark/**/tables/**"
    - "engine-benchmark/**/data/**"
    - "engine-benchmark/**/captions.yml"
    - "engine-benchmark/**/PUBLICATION_MANIFEST.yml"
    - "engine-benchmark/**/checksums.sha256"

filters:
  - bms-link-policy

metadata-files:
  - _learn-navigation.yml

website:
  title: "Backgammon Made Simple"
  description: "Learn the ideas behind strong backgammon decisions, one concept and one position at a time."
  site-url: "https://backgammon-made-simple.github.io"
  search:
    location: navbar
    type: overlay
  favicon: assets/icons/favicon.ico
  image: /assets/social/generated/social-default.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    logo: assets/logo.svg
    logo-alt: "Backgammon Made Simple"
    left:
      - text: Learn
        href: learn/index.qmd
      - href: analyze/index.qmd
        text: Analyze
      - href: match-predictor/index.qmd
        text: Match Predictor
      - href: engine-benchmark/sage-vs-gnu-stage1/index.qmd
        text: Sage vs GNU
      - href: research/index.qmd
        text: Research
      - href: about.qmd
        text: About
  page-footer:
    left: |
      Copyright 2026 Marty Gale - Backgammon Made Simple
    center:
      - text: "Code: AGPL-3.0-only · Educational content: CC BY-SA 4.0 · Licensing"
        href: /licensing.html
    right:
      - text: RSS
        href: /updates/index.xml

format:
  html:
    theme: [cosmo, assets/bms-theme.scss]
    css:
      - assets/bms-shared.css
      - assets/bms-components.css
      - assets/bms-learn.css
    include-after-body:
      - includes/bms-scripts.html
    include-in-header:
      - includes/site-head.html
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "On this page"
    smooth-scroll: true
    link-external-newwindow: false
    code-copy: true

execute:
  freeze: auto

editor: source
